plugins {
	id 'net.fabricmc.fabric-loom-remap'
}

ext {
	mc = '1.20.1'
	fabricApi = '0.92.12+1.20.1'
	javaRelease = 17
	// Veri klasörlerinin adları bu sürümde çoğul; hepsi tools/legacy_resources.py ile üretilir.
	sharedExcludes = ['data/**', 'assets/realcars/items/**']
}

apply from: rootProject.file('versions/common.gradle')

dependencies {
	// 26.x'te Minecraft ile gelen null işaretleri; eski sürümlerde ayrıca eklenir.
	compileOnly 'org.jspecify:jspecify:1.0.0'
}

loom {
	runs {
		// Fabric'in istemci test API'si bu sürümde yok; yerine DevAutotest.
		// Önce tools/smoke_test.sh ile bir dünya üretilir (run/smoketest).
		autotest {
			inherit client
			name "Client Autotest"
			vmArg "-Drealcars.autotest=true"
			programArgs "--quickPlaySingleplayer", "smoke"
			runDir "run/autotest"
		}
	}
}
